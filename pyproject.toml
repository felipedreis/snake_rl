[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-rl"
version = "0.1.0"
description = "Neural Episodic Control and baselines on Snake, in pure NumPy with hand-written gradients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
snake-run = "snake_rl.run:cli"
snake-plot = "snake_rl.plot:cli"
snake-peek = "snake_rl.peek:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
