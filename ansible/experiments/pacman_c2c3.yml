# Exploratory follow-up (docs/CALIBRATION_AUDIT.md, checks C2 and C3; base arms are in pacman_calibration); not pre-registered.
# C2 (DQN target sync; base target_every = 1000 agent steps = 250 updates, the paper's is 10,000 updates = 40,000 agent steps):
#    target_every 4000 and 40000, each on arm A (small rewards, unclipped) and arm B (Atari units, clipped), RMSProp 2.5e-4.
# C3 (NEC memory): arm D (Atari units, RMSProp 1e-4) with dnd_cap 100000 (no eviction in 100k steps), and with dnd_cap 100000 + N 100 (the paper's N).
name: pacman_c2c3
time: "16:00:00"
mem: 8G
max_parallel: 30
results_dir: exp_pacman_c2c3
pull_agents: true
jobs:
  - "dqn_naturecnn 1 100000 --game pacman --eval-every 10000 --eval-episodes 20 --save-agent --opt rmsprop --lr 2.5e-4 --agent-kw target_every=4000"
  - "dqn_naturecnn 2 100000 --game pacman --eval-every 10000 --eval-episodes 20 --save-agent --opt rmsprop --lr 2.5e-4 --agent-kw target_every=4000"
  - "dqn_naturecnn 3 100000 --game pacman --eval-every 10000 --eval-episodes 20 --save-agent --opt rmsprop --lr 2.5e-4 --agent-kw target_every=4000"
