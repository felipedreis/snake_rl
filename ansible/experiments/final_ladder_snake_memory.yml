  - "nec 25 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --opt rmsprop --lr 1e-4 --agent-kw dnd_cap=500000"
  - "nec 26 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --opt rmsprop --lr 1e-4 --agent-kw dnd_cap=500000"
  - "nec 27 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --opt rmsprop --lr 1e-4 --agent-kw dnd_cap=500000"
