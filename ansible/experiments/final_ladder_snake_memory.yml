# Pre-registered in docs/experiments/final_ladder/PROTOCOL.md (frozen; hashes in FROZEN.sha256). The snake half of the ladder, memory arms.
# NEC and ec_frozen with the paper's DND capacity (5e5 per action): brute-force kNN grows with the memory, ~2 days per run,
# so they run on 'extended' (21-day limit, 48 CPUs per user).
name: final_ladder_snake_memory
command: snake-run
ccad_partition: extended
ccad_qos: extended_qos
time: "7-00:00:00"
mem: 8G
max_parallel: 20
results_dir: exp_final_ladder
pull_agents: true
jobs:
  - "ec_frozen 21 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 22 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 23 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 24 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 25 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 26 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 27 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 28 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 29 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "ec_frozen 30 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
  - "nec 21 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --opt rmsprop --lr 1e-4 --agent-kw dnd_cap=500000"
  - "nec 22 1000000 --size 10 --render pixels --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --opt rmsprop --lr 1e-4 --agent-kw dnd_cap=500000"
