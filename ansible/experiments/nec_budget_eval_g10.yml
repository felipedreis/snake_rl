# Pre-registered in docs/experiments/nec_budget_eval_g10/PROTOCOL.md: 5 learned conditions + a random baseline, seeds 11-20, 250k steps.
# Training runs save an agent every 60k steps and at the end (about 50 MB each); collect.yml pulls them because pull_agents is true.
