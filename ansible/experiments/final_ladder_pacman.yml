# Pre-registered in docs/experiments/final_ladder/PROTOCOL.md (frozen; hashes in FROZEN.sha256). The pacman half of the ladder.
# The fast arms (DQN, N-step DQN, MFEC, random) on 'normal' (3-day limit); NEC and ec_frozen are in final_ladder_pacman_memory.yml.
name: final_ladder_pacman
command: pacman-run
ccad_partition: normal
ccad_qos: normal_qos
time: "3-00:00:00"
mem: 10G
max_parallel: 40
results_dir: exp_final_ladder
pull_agents: true
jobs:
  - "dqn 21 1000000 --reward-units atari --eval-every 25000 --eval-episodes 20 --save-every 500000 --opt rmsprop --lr 2.5e-4 --clip-reward --agent-kw target_every=4000"
  - "dqn 22 1000000 --reward-units atari --eval-every 25000 --eval-episodes 20 --save-every 500000 --opt rmsprop --lr 2.5e-4 --clip-reward --agent-kw target_every=4000"
