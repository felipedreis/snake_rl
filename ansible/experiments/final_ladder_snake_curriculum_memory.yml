# Pre-registered in docs/experiments/final_ladder/PROTOCOL.md, revision 2 (frozen; hashes in FROZEN.sha256). Snake with the food curriculum, memory arms.
# 8 at once so that, with final_ladder_snake_memory and final_ladder_pacman_memory (20 each), the 48-CPU limit on 'extended' holds (about three waves).
name: final_ladder_snake_curriculum_memory
command: snake-run
ccad_partition: extended
ccad_qos: extended_qos
time: "7-00:00:00"
mem: 8G
max_parallel: 8
results_dir: exp_final_ladder
pull_agents: true
jobs:
  - "ec_frozen 21 1000000 --size 10 --render pixels --food-curriculum 2:50000:150000 --food-relocate --eval-every 25000 --eval-episodes 20 --probe-every 50000 --probe-far --save-every 500000 --agent-kw dnd_cap=500000"
