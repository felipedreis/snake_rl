---
# One-time (idempotent) setup on the CCAD login node: copy the code and build a venv with snake-rl installed.
# Compute nodes have no internet, so everything is installed here. $HOME is shared NFS, so they see it.
#   cd ansible && ansible-playbook -i inventories/ccad provision.yml
- name: Provision the snake venv on CCAD
  hosts: runner
  gather_facts: false
  tasks:
    - name: Ensure the remote directories exist
      ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
      loop: ["{{ remote_dir }}", "{{ remote_dir }}/code", "{{ remote_dir }}/runs"]

    - name: Sync the code
      ansible.builtin.import_tasks: tasks/sync_code.yml

    - name: Create the venv
      ansible.builtin.command:
        cmd: "{{ ccad_python }} -m venv {{ remote_dir }}/.venv"
        creates: "{{ remote_dir }}/.venv/bin/python"

    - name: Install snake-rl (editable) into the venv
      ansible.builtin.command:
        cmd: "{{ remote_dir }}/.venv/bin/pip install --quiet -e {{ remote_dir }}/code"
      changed_when: true

    - name: Check that the package imports
      ansible.builtin.command:
        cmd: "{{ remote_dir }}/.venv/bin/python -c 'import numpy, snake_rl; print(numpy.__version__)'"
      register: _check
      changed_when: false

    - ansible.builtin.debug: { msg: "numpy {{ _check.stdout }} in {{ remote_dir }}/.venv" }
