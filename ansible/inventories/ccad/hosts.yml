all:
  children:
    # CEFET-MG's CCAD HPC cluster (https://www.ccad.cefetmg.br/guia/): SLURM, shared NFS $HOME. Needs the CEFET VPN, which
    # drops when idle, so jobs are submitted and collected later, never waited on. Login is your CPF (no punctuation),
    # read from the gitignored .env.local at the repo root (CCAD_USERNAME=...), or pass -e ccad_user=<cpf>.
    # ~/.ssh/config may pin this host's IP when the VPN's DNS does not resolve it.
    runner:
      hosts:
        login.ccad.cefetmg.br:
          ansible_user: "{{ ccad_user }}"
